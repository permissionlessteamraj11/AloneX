<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ɴᴀʀᴢᴏx ᴘᴀɴᴇʟ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020f08; color: #e2e8f0; }
        .small-caps { font-variant: all-small-caps; }
        .bg-dark-green { background-color: #052e16; }
        .border-premium { border-color: #166534; }
        .text-premium { color: #4ade80; }
        .btn-premium { background-color: #166534; transition: all 0.3s; }
        .btn-premium:hover { background-color: #15803d; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 flex justify-between items-center">
            <h1 class="text-3xl font-bold small-caps text-premium">ɴᴀʀᴢᴏx ᴘᴀɴᴇʟ</h1>
            <button onclick="logout()" class="text-sm small-caps border border-premium px-4 py-1 rounded">ʟᴏɢᴏᴜᴛ</button>
        </header>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-8" id="stats-container"></div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <section class="bg-dark-green p-6 rounded-xl border border-premium">
                <h2 class="text-xl font-semibold mb-4 small-caps text-premium">ɢʟᴏʙᴀʟ ʙʀᴏᴀᴅᴄᴀsᴛ</h2>
                <textarea id="broadcast-msg" class="w-full bg-black border border-premium rounded p-3 mb-4 h-32 text-white" placeholder="ENTER MESSAGE..."></textarea>
                <div class="flex gap-4 mb-4">
                    <select id="broadcast-target" class="bg-black border border-premium rounded p-2 text-white flex-1">
                        <option value="all">ALL USERS & CLONES</option>
                        <option value="main">MAIN BOT ONLY</option>
                        <option value="clones">CLONED BOTS ONLY</option>
                    </select>
                </div>
                <button onclick="sendBroadcast()" class="w-full btn-premium py-3 rounded-lg font-bold small-caps">sᴇɴᴅ ᴍᴇssᴀɢᴇ ᴏɴᴄᴇ</button>
            </section>

            <section class="bg-dark-green p-6 rounded-xl border border-premium">
                <h2 class="text-xl font-semibold mb-4 small-caps text-premium">ᴘʀᴇᴍɪᴜᴍ ᴍᴀɴᴀɢᴇʀ</h2>
                <div class="space-y-4">
                    <input id="prem-user-id" type="number" class="w-full bg-black border border-premium rounded p-2 text-white" placeholder="USER ID">
                    <input id="prem-days" type="number" class="w-full bg-black border border-premium rounded p-2 text-white" placeholder="DAYS (0 FOR LIFETIME)">
                    <div class="flex gap-4">
                        <button onclick="managePremium('grant')" class="flex-1 btn-premium py-2 rounded-lg font-bold small-caps">ɢɪᴠᴇ ᴘʀᴇᴍɪᴜᴍ</button>
                        <button onclick="managePremium('remove')" class="flex-1 bg-red-900 hover:bg-red-800 py-2 rounded-lg font-bold small-caps">ʀᴇᴍᴏᴠᴇ</button>
                    </div>
                </div>
            </section>
        </div>

        <section class="mt-8 bg-dark-green p-6 rounded-xl border border-premium">
            <h2 class="text-xl font-semibold mb-4 small-caps text-premium">ᴍᴀɴᴀɢᴇʀ sᴇᴛᴛɪɴɢs</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input id="welcome_banner" type="text" class="bg-black border border-premium rounded p-2 text-white" placeholder="WELCOME BANNER URL">
                <input id="support_link" type="text" class="bg-black border border-premium rounded p-2 text-white" placeholder="SUPPORT LINK">
                <input id="updates_link" type="text" class="bg-black border border-premium rounded p-2 text-white" placeholder="UPDATES LINK">
            </div>
            <button onclick="updateSettings()" class="mt-4 w-full btn-premium py-3 rounded-lg font-bold small-caps">sᴀᴠᴇ sᴇᴛᴛɪɴɢs</button>
        </section>

        <section class="mt-8 bg-dark-green p-6 rounded-xl border border-premium overflow-x-auto">
            <h2 class="text-xl font-semibold mb-4 small-caps text-premium">ᴄʟᴏɴᴇ ᴍᴀɴᴀɢᴇʀ</h2>
            <table class="w-full text-left">
                <thead>
                    <tr class="border-b border-premium text-xs small-caps">
                        <th class="py-2">ʙᴏᴛ</th>
                        <th class="py-2">ᴏᴡɴᴇʀ</th>
                        <th class="py-2">sᴛᴀᴛᴜs</th>
                    </tr>
                </thead>
                <tbody id="clones-body"></tbody>
            </table>
        </section>
    </div>

    <script>
        const API_BASE = '';
        let token = localStorage.getItem('token');

        if(!token && window.location.pathname !== '/login') {
            // Simple prompt for demo, real panel would have login page
            const pass = prompt('ENTER OWNER PASSWORD (ID BY DEFAULT)');
            if(pass) login(pass);
        }

        async function login(password) {
            const formData = new URLSearchParams();
            formData.append('username', '7524032836'); // Default owner
            formData.append('password', password);
            const res = await fetch('/token', { method: 'POST', body: formData });
            if(res.ok) {
                const data = await res.json();
                localStorage.setItem('token', data.access_token);
                location.reload();
            }
        }

        async function fetchStats() {
            const res = await fetch('/stats', { headers: { 'Authorization': `Bearer ${token}` } });
            if(res.ok) {
                const data = await res.json();
                const container = document.getElementById('stats-container');
                const labels = {
                    total_users: 'TOTAL USERS', total_chats: 'TOTAL CHATS', active_players: 'ACTIVE PLAYERS',
                    premium_users: 'PREMIUM USERS', cloned_bots: 'CLONED BOTS', revenue_tracking: 'REVENUE'
                };
                container.innerHTML = Object.entries(labels).map(([key, label]) => `
                    <div class="bg-dark-green p-4 rounded-lg border border-premium text-center">
                        <div class="text-xs small-caps opacity-70">${label}</div>
                        <div class="text-xl font-bold text-premium mt-1">${data[key] || 0}</div>
                    </div>
                `).join('');
            }
        }

        async function sendBroadcast() {
            const message = document.getElementById('broadcast-msg').value;
            const target = document.getElementById('broadcast-target').value;
            await fetch('/api/broadcast', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, target })
            });
            alert('BROADCAST SENT');
        }

        async function managePremium(action) {
            const user_id = document.getElementById('prem-user-id').value;
            const days = document.getElementById('prem-days').value;
            await fetch(`/api/premium/${action}`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: parseInt(user_id), days: parseInt(days) })
            });
            alert('PREMIUM UPDATED');
        }

        if(token) fetchStats();
    </script>
</body>
</html>
